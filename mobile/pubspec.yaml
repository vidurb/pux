name: pux
description: Encrypted OTP relay client for pux.
publish_to: "none"
# The build number comes from CI (--build-number), so only the version is kept here.
version: 0.1.0 # x-release-please-version

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_secure_storage: ^11.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.1
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  http: ^1.3.0
  sodium: ^4.1.2
  flutter_riverpod: ^3.5.0
  web_socket_channel: ^3.0.2
  no_screenshot: ^2.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  # Pinned to what flutter_local_notifications already resolves, for the Linux
  # missing-daemon test.
  dbus: ^0.8.0
  flutter_local_notifications_linux: ^9.0.0

flutter:
  uses-material-design: true

# Sources are rendered from brand/app/ by scripts/render-brand.sh. Regenerate with:
#   flutter pub run flutter_launcher_icons && flutter pub run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  image_path_android: assets/icon/ios.png
  adaptive_icon_background: "#0E3B32"
  adaptive_icon_foreground: assets/icon/adaptive-foreground.png
  adaptive_icon_monochrome: assets/icon/adaptive-monochrome.png
  # The sources already sit inside the adaptive safe zone.
  adaptive_icon_foreground_inset: 0
  ios: true
  image_path_ios: assets/icon/ios.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/macos.png
  windows:
    generate: false
  web:
    generate: false

flutter_native_splash:
  color: "#0E3B32"
  image: assets/icon/splash.png
  android_12:
    color: "#0E3B32"
    image: assets/icon/splash.png
  android: true
  ios: true
  web: false
