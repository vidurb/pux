name: release

# Normally started by the release-please workflow: merging its release PR tags
# vX.Y.Z (with a draft GitHub Release) and runs this workflow on that tag. A tag
# pushed by hand (v0.2.0-rc.1 for a pre-release) runs it too. The tag must match
# the versions in server/mix.exs and mobile/pubspec.yaml; see CONTRIBUTING.md.
#
# Run it by hand on a branch from the Actions tab to try the builds, signing and
# notarization without a release: the artifacts are attached to the run, and
# nothing is published.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PUX_SERVER_URL: https://pux.vidur.xyz
  # Android versionCode and macOS CFBundleVersion. Monotonic across runs of this
  # workflow, which is what Google Play needs; renaming this file resets it.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          server=$(sed -nE 's/^ *version: "([^"]+)",/\1/p' server/mix.exs)
          mobile=$(sed -nE 's/^version: ([^ +#]+).*/\1/p' mobile/pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # A trial run: name the artifacts after the app version and the run.
            echo "version=$mobile-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "tag=$version server=$server mobile=$mobile"
          test "$version" = "$server" || { echo "::error::server/mix.exs is $server, tag is $version"; exit 1; }
          test "$version" = "$mobile" || { echo "::error::mobile/pubspec.yaml is $mobile, tag is $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/vidurb/pux-server
          # semver tags also set `latest`, except for pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > "$RUNNER_TEMP/android-key.properties"
      - name: Build release APK and AAB
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease lintVitalRelease \
            -PkeyProperties="$RUNNER_TEMP/android-key.properties" \
            -PversionCode="$BUILD_NUMBER" -PversionName="$VERSION" -PpuxServerUrl="$PUX_SERVER_URL"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/pux-$VERSION-android.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/pux-$VERSION-android.aab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: native/android/dist/*
          if-no-files-found: error
      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/android-key.properties"

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native/macos
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP: build/pux.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Signed with Developer ID and notarized, so Gatekeeper opens it without a
      # warning. One-time setup is in mobile/macos/README.md.
      - name: Check configuration
        env:
          MACOS_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID MACOS_DEVELOPER_ID_CERT_P12_BASE64 MACOS_DEVELOPER_ID_CERT_PASSWORD \
            MACOS_DEVELOPER_ID_PROFILE_BASE64 \
            APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (see mobile/macos/README.md)"; missing=1; fi
          done
          exit "$missing"

      - name: Install certificate and profile
        env:
          MACOS_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MACOS_DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/developer_id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer_id.p12" -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '"' | xargs)"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/developer_id.p12"

          # By hash, so another identity with a similar name can't be picked.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: .*\('"$APPLE_TEAM_ID"'\)"/ { print $2; exit }')
          test -n "$identity" || { echo "::error::no Developer ID Application certificate for team $APPLE_TEAM_ID in MACOS_DEVELOPER_ID_CERT_P12_BASE64"; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

          echo "$MACOS_DEVELOPER_ID_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/developer_id.provisionprofile"
          echo "PROFILE=$RUNNER_TEMP/developer_id.provisionprofile" >> "$GITHUB_ENV"

      - name: Build universal native app
        env:
          PUX_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/bundle_app.sh release

      - name: Sign
        run: scripts/sign_app.sh "$APP" "$SIGNING_IDENTITY" "$APPLE_TEAM_ID" "$PROFILE"

      # The app keeps its keys in the data protection keychain, which refuses
      # programs without a keychain access group. Prove this signature has one
      # before shipping an app that can't save an enrollment.
      - name: Check keychain access
        run: ../../mobile/macos/scripts/keychain_probe.sh "$APP" "$SIGNING_IDENTITY" "$APPLE_TEAM_ID" "$PROFILE"

      - name: Notarize and package
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$key"
          auth=(--key "$key" --key-id "$APP_STORE_CONNECT_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID")

          notarize() {
            local result id status
            result=$(xcrun notarytool submit "$1" "${auth[@]}" --wait --timeout 30m --output-format json) || true
            echo "$result"
            id=$(jq -r '.id // empty' <<< "$result")
            status=$(jq -r '.status // empty' <<< "$result")
            if [ "$status" != Accepted ]; then
              if [ -n "$id" ]; then xcrun notarytool log "$id" "${auth[@]}"; fi
              echo "::error::notarization of $(basename "$1") ended with status '${status:-none}'"
              return 1
            fi
          }

          # The app first, so its own ticket is stapled and it opens offline
          # after being copied out of the disk image.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/pux.zip"
          notarize "$RUNNER_TEMP/pux.zip"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          dmg="$PWD/dist/pux-$VERSION-macos.dmg"
          mkdir -p dist
          ../../mobile/macos/scripts/make_dmg.sh "$APP" "$dmg"
          codesign --sign "$SIGNING_IDENTITY" --timestamp "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: native/macos/dist/*
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.provisionprofile "$RUNNER_TEMP"/*.p12

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsodium-dev libcurl4-openssl-dev libssl-dev dpkg-dev
      - name: Build native Linux client
        run: |
          cmake -S native/linux -B native/linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/linux/build
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          native/linux/packaging/build_deb.sh native/linux/build/pux "$VERSION" "dist/pux-$VERSION-linux-amd64.deb"
          native/linux/packaging/build_tar.sh native/linux/build/pux "$VERSION" "dist/pux-$VERSION-linux-x64.tar.gz"
          dpkg-deb --info "dist/pux-$VERSION-linux-amd64.deb"
          tar -tzf "dist/pux-$VERSION-linux-x64.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, image, android, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Server image: \`ghcr.io/vidurb/pux-server:$VERSION\`"
          } >> notes.md
          (cd dist && sha256sum -- * > SHA256SUMS)
      # release-please has already made a draft release for this tag; attach the
      # builds and publish it. A tag pushed by hand has no release yet.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--title "pux $GITHUB_REF_NAME" --notes-file notes.md)
          if gh release view "$GITHUB_REF_NAME" --json isDraft > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" "${flags[@]}" --prerelease="$PRERELEASE" --draft=false
          else
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${flags[@]}"
          fi

  # Uploads the AAB to Google Play once PLAY_SERVICE_ACCOUNT_JSON is set; skipped
  # until then. Google only accepts API uploads after the first AAB has been
  # uploaded by hand in Play Console. Setup is in CONTRIBUTING.md.
  play:
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the AAB was not uploaded to Google Play."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: dist
      - if: steps.config.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: xyz.vidur.pux
          releaseFiles: dist/pux-${{ needs.version.outputs.version }}-android.aab
          releaseName: ${{ needs.version.outputs.version }}
          # internal by default; "draft" until the app's first review is done.
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
