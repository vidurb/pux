version: 2
updates:
  - package-ecosystem: mix
    directory: /server
    schedule:
      interval: weekly
    groups:
      mix:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
