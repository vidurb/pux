name: mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
  workflow_dispatch:

env:
  PUX_SERVER_URL: https://pux.vidur.xyz

permissions:
  contents: read

jobs:
  # Pull requests start this workflow whatever they change, so the required
  # "-ok" check below always reports. This job decides whether there is
  # anything to test; pushes to main always run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            run=false
            while IFS= read -r file; do
              case "$file" in
                mobile/*|.github/workflows/mobile.yml) run=true ;;
              esac
            done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run the checks: $run"

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8" # keep in step with mise.toml
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin the JDK Gradle and AGP run on (17, as in mise.toml).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8" # keep in step with mise.toml
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pux-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # The iOS, macOS and Linux builds are unsigned and use no secrets, so they run on pull
  # requests too, including ones from forks. Signed builds live in release.yml and
  # testflight.yml, which only run on tags or by hand.
  build-ios:
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8" # keep in step with mise.toml
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"

  build-macos:
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8" # keep in step with mise.toml
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8" # keep in step with mise.toml
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"

  # The check to require on main: it passes when every job above passed, or was
  # skipped because the pull request doesn't touch this part of the repo.
  mobile-ok:
    if: always()
    needs: [changes, test, build-android, build-ios, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A job this check depends on failed or was cancelled."
          exit 1
      - run: echo "Every job passed or had nothing to check."
