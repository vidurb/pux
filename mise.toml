[tools]
erlang = "29.1.2"
elixir = "1.20.5-otp-29"
# Android Gradle
java = "temurin-21.0.13+9.0.LTS"
hk = "2.11.1"
jactionlint = "2.5.0"

[tasks.setup-server]
description = "Fetch Elixir dependencies"
dir = "server"
run = "mix deps.get"

[tasks.setup-hooks]
description = "Install git hooks (hk + mise)"
run = "hk install --mise"

[tasks.setup]
description = "Install deps and git hooks after mise install"
depends = ["setup-server", "setup-hooks"]
