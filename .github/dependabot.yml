version: 2
updates:
  - package-ecosystem: mix
    directory: /server
    schedule:
      interval: weekly
    groups:
      mix:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      # v11 drops the Android EncryptedSharedPreferences migration, so hold it
      # until existing installs have run a build on v10.
      - dependency-name: flutter_secure_storage
        update-types: ["version-update:semver-major"]
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
