name: release

# Push a tag like v0.1.0 (or v0.2.0-rc.1 for a pre-release). The tag must match the
# versions in server/mix.exs and mobile/pubspec.yaml; see CONTRIBUTING.md.
#
# Run it by hand from the Actions tab to try the builds, signing and notarization
# without a release: the artifacts are attached to the run, and nothing is
# published.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PUX_SERVER_URL: https://pux.vidur.xyz

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          server=$(sed -nE 's/^ *version: "([^"]+)",/\1/p' server/mix.exs)
          mobile=$(sed -nE 's/^version: ([^+]+)\+.*/\1/p' mobile/pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # A trial run: name the artifacts after the app version and the run.
            echo "version=$mobile-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "tag=$version server=$server mobile=$mobile"
          test "$version" = "$server" || { echo "::error::server/mix.exs is $server, tag is $version"; exit 1; }
          test "$version" = "$mobile" || { echo "::error::mobile/pubspec.yaml is $mobile, tag is $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/vidurb/pux-server
          # semver tags also set `latest`, except for pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gradle 8.14 can't run on the runner's default JDK; match mise.toml.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
      - run: flutter build appbundle --release --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
      - name: Collect
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/pux-${{ needs.version.outputs.version }}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/pux-${{ needs.version.outputs.version }}-android.aab"
          rm -f android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: mobile/dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP: build/macos/Build/Products/Release/pux.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # Signed with Developer ID and notarized, so Gatekeeper opens it without a
      # warning. One-time setup is in mobile/macos/README.md.
      - name: Check configuration
        env:
          MACOS_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID MACOS_DEVELOPER_ID_CERT_P12_BASE64 MACOS_DEVELOPER_ID_CERT_PASSWORD \
            MACOS_DEVELOPER_ID_PROFILE_BASE64 \
            APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (see mobile/macos/README.md)"; missing=1; fi
          done
          exit "$missing"

      - name: Install certificate and profile
        env:
          MACOS_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MACOS_DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/developer_id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer_id.p12" -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '"' | xargs)"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/developer_id.p12"

          # By hash, so another identity with a similar name can't be picked.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: .*\('"$APPLE_TEAM_ID"'\)"/ { print $2; exit }')
          test -n "$identity" || { echo "::error::no Developer ID Application certificate for team $APPLE_TEAM_ID in MACOS_DEVELOPER_ID_CERT_P12_BASE64"; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

          echo "$MACOS_DEVELOPER_ID_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/developer_id.provisionprofile"
          echo "PROFILE=$RUNNER_TEMP/developer_id.provisionprofile" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter build macos --release --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"

      - name: Sign
        run: macos/scripts/sign_app.sh "$APP" "$SIGNING_IDENTITY" "$APPLE_TEAM_ID" "$PROFILE"

      # The app keeps its keys in the data protection keychain, which refuses
      # programs without a keychain access group. Prove this signature has one
      # before shipping an app that can't save an enrollment.
      - name: Check keychain access
        run: macos/scripts/keychain_probe.sh "$APP" "$SIGNING_IDENTITY" "$APPLE_TEAM_ID" "$PROFILE"

      - name: Notarize and package
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$key"
          auth=(--key "$key" --key-id "$APP_STORE_CONNECT_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID")

          notarize() {
            local result id status
            result=$(xcrun notarytool submit "$1" "${auth[@]}" --wait --timeout 30m --output-format json) || true
            echo "$result"
            id=$(jq -r '.id // empty' <<< "$result")
            status=$(jq -r '.status // empty' <<< "$result")
            if [ "$status" != Accepted ]; then
              if [ -n "$id" ]; then xcrun notarytool log "$id" "${auth[@]}"; fi
              echo "::error::notarization of $(basename "$1") ended with status '${status:-none}'"
              return 1
            fi
          }

          # The app first, so its own ticket is stapled and it opens offline
          # after being copied out of the disk image.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/pux.zip"
          notarize "$RUNNER_TEMP/pux.zip"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          dmg="$PWD/dist/pux-$VERSION-macos.dmg"
          mkdir -p dist
          macos/scripts/make_dmg.sh "$APP" "$dmg"
          codesign --sign "$SIGNING_IDENTITY" --timestamp "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: mobile/dist/*
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.provisionprofile "$RUNNER_TEMP"/*.p12

  linux:
    needs: version
    # The oldest supported runner, so the binaries and the .deb's dependencies
    # work on Ubuntu 22.04 and Debian 12 as well as newer releases.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev dpkg-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          bundle=build/linux/x64/release/bundle
          tar -C "$bundle" -czf "dist/pux-$VERSION-linux-x64.tar.gz" .
          linux/packaging/build_deb.sh "$bundle" "$VERSION" "dist/pux-$VERSION-linux-amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: mobile/dist/*
          if-no-files-found: error

  publish:
    needs: [version, image, android, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Server image: \`ghcr.io/vidurb/pux-server:$VERSION\`"
          } >> notes.md
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "pux $GITHUB_REF_NAME" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
