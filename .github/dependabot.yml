version: 2

# Commit prefixes feed release-please (see release-please-config.json): updates
# that ship in the server image or the apps are fixes, so they go in the next
# patch release; CI-only updates don't trigger one.
updates:
  - package-ecosystem: mix
    directory: /server
    schedule:
      interval: weekly
    groups:
      mix:
        patterns: ["*"]
    commit-message:
      prefix: fix
      # Test and tooling dependencies don't ship, so they don't cut a release.
      prefix-development: chore
      include: scope

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]
    commit-message:
      prefix: fix
      # Test and tooling dependencies don't ship, so they don't cut a release.
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # hexpm/elixir has about a million tags, so listing them times out (504) and
      # fails every job. Skip the lookup and bump this image by hand.
      - dependency-name: hexpm/elixir
      # A new Alpine release has to move with the hexpm/elixir build stage, so
      # Dependabot only gets patch updates within the current release.
      - dependency-name: alpine
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
