name: testflight

# Builds the iOS app and uploads it to TestFlight. Runs on release tags, and by hand
# from the Actions tab for in-between builds. One-time setup (certificate, profiles,
# API key, secrets) is in mobile/ios/README.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Uploads must not race: each one needs a build number higher than the last.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  PUX_SERVER_URL: https://pux.vidur.xyz

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Monotonic across runs of this workflow, which is what App Store Connect needs.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8" # keep in step with mise.toml
          cache: true

      - name: Check configuration
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
            IOS_APP_PROFILE_BASE64 IOS_EXTENSION_PROFILE_BASE64 \
            APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (see mobile/ios/README.md)"; missing=1; fi
          done
          exit "$missing"

      - name: Install certificate and profiles
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '"' | xargs)"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/dist.p12"

          # Xcode 16 and later read profiles from UserData; older versions from MobileDevice.
          dirs=("$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles")
          mkdir -p "${dirs[@]}"
          for kind in APP EXTENSION; do
            var="IOS_${kind}_PROFILE_BASE64"
            file="$RUNNER_TEMP/$kind.mobileprovision"
            echo "${!var}" | base64 -d > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/$kind.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$kind.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$kind.plist")
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/$kind.plist")
            for dir in "${dirs[@]}"; do cp "$file" "$dir/$uuid.mobileprovision"; done
            echo "${kind}_PROFILE_NAME=$name" >> "$GITHUB_ENV"
            echo "$kind profile: $name ($app_id)"
          done

      - name: Switch app targets to manual signing
        run: |
          gem install xcodeproj --version 1.28.1 --no-document
          ruby ios/scripts/ci_manual_signing.rb "$APPLE_TEAM_ID" "$APP_PROFILE_NAME" "$EXTENSION_PROFILE_NAME"

      - run: flutter pub get
      - name: Generate Flutter build config
        run: |
          flutter build ios --config-only --release --build-number="$BUILD_NUMBER" \
            --dart-define=PUX_SERVER_URL="$PUX_SERVER_URL"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/pux.xcarchive"

      - name: Export and upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$key"

          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string upload "$options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$options"
          plutil -insert signingStyle -string manual "$options"
          plutil -insert signingCertificate -string "Apple Distribution" "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          plutil -insert uploadSymbols -bool YES "$options"
          plutil -insert provisioningProfiles -dictionary "$options"
          plutil -insert provisioningProfiles.xyz\\.vidur\\.pux -string "$APP_PROFILE_NAME" "$options"
          plutil -insert provisioningProfiles.xyz\\.vidur\\.pux\\.NotificationService -string "$EXTENSION_PROFILE_NAME" "$options"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/pux.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight once App Store Connect finishes processing it." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.mobileprovision
