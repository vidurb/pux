name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pux_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/deps
            server/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('server/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix hex.audit
      - run: mix deps.audit
      - run: mix sobelow --exit medium
      - run: mix test

  # Smoke-tests the image on each platform that publish pushes, on a native runner for
  # each (no QEMU), so an arm64-only break fails here instead of in production. Runs on
  # pushes to main too, because publish waits for it.
  image:
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/pux
      SECRET_KEY_BASE: ci-only-secret-key-base-0123456789012345678901234567890123456789
      LIVE_VIEW_SIGNING_SALT: ci-salt-1234567890
      COOKIE_SIGNING_SALT: ci-salt-1234567890
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          tags: pux-server:ci
      # Booting can't catch this: musl 1.2.6 makes OTP 27 abort on every start on Intel
      # AMX hosts and never elsewhere, and only about 1 runner in 10 has AMX. So check the
      # version instead, on both platforms since they build from the same Dockerfile.
      # Remove this once the image's OTP includes erlang/otp#11810.
      - name: Both stages use a musl that OTP 27 can start on, on any CPU
        run: |
          uname -m
          grep -m1 -E '^(model name|CPU part)' /proc/cpuinfo || true
          grep -qw amx_tile /proc/cpuinfo && echo "host has AMX" || echo "host has no AMX"
          LD_SHOW_AUXV=1 /bin/true | grep AT_MINSIGSTKSZ || true
          docker buildx build --target build --load -t pux-server:ci-build server
          for image in pux-server:ci-build pux-server:ci; do
            version=$(docker run --rm --entrypoint sh "$image" -c '/lib/ld-musl-*.so.1 2>&1 || true' | sed -n 's/^Version //p')
            echo "$image: musl $version"
            test -n "$version"
            test "$(printf '%s\n1.2.6\n' "$version" | sort -V | head -n 1)" != 1.2.6
          done
      - name: Release boots as non-root on a read-only filesystem
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -e DATABASE_URL -e SECRET_KEY_BASE -e LIVE_VIEW_SIGNING_SALT -e COOKIE_SIGNING_SALT \
            pux-server:ci bin/pux eval 'IO.puts(Application.get_env(:pux, :smtp)[:port])' | tee out.txt
          grep -qx 2525 out.txt
          test "$(docker run --rm pux-server:ci id -u)" = 65534
      # Loads the enacl NIF (libsodium) and the crypto NIF (OpenSSL) against the runtime
      # stage's libraries, using the same primitives as sealing and DKIM verification.
      - name: Libsodium and OpenSSL work inside the image
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -e DATABASE_URL -e SECRET_KEY_BASE -e LIVE_VIEW_SIGNING_SALT -e COOKIE_SIGNING_SALT \
            pux-server:ci bin/pux eval '
              %{public: pk, secret: sk} = :enacl.box_keypair()
              {:ok, sealed} = Pux.Crypto.seal("123456", pk)
              {:ok, "123456"} = :enacl.box_seal_open(sealed, pk, sk)

              IO.inspect(:crypto.info_lib())
              "ungWv48Bz+pBQUDeXa4iI7ADYaOWF3qctBD/YfIAFa0=" = Base.encode64(:crypto.hash(:sha256, "abc"))
              key = :crypto.strong_rand_bytes(32)
              iv = :crypto.strong_rand_bytes(12)
              {ct, tag} = :crypto.crypto_one_time_aead(:aes_256_gcm, key, iv, "otp", "", true)
              "otp" = :crypto.crypto_one_time_aead(:aes_256_gcm, key, iv, ct, "", tag, false)
              {rsa_pub, rsa_priv} = :crypto.generate_key(:rsa, {2048, 65537})
              rsa_sig = :crypto.sign(:rsa, :sha256, "otp", rsa_priv)
              true = :crypto.verify(:rsa, :sha256, "otp", rsa_sig, rsa_pub)
              {ed_pub, ed_priv} = :crypto.generate_key(:eddsa, :ed25519)
              ed_sig = :crypto.sign(:eddsa, :none, "otp", [ed_priv, :ed25519])
              true = :crypto.verify(:eddsa, :none, "otp", ed_sig, [ed_pub, :ed25519])
              {:ok, _} = Application.ensure_all_started(:ssl)

              IO.puts("crypto-ok")
            ' | tee crypto.txt
          grep -qx crypto-ok crypto.txt
      # Runs the image's own command: migrations, then the HTTP and SMTP listeners.
      - name: Release migrates and serves against Postgres
        run: |
          docker run -d --name pux --network host --read-only --tmpfs /tmp \
            -e DATABASE_URL -e SECRET_KEY_BASE -e LIVE_VIEW_SIGNING_SALT -e COOKIE_SIGNING_SALT \
            pux-server:ci
          for _ in $(seq 1 60); do
            if [ "$(curl -sS --max-time 2 http://localhost:4000/health || true)" = '{"status":"ok"}' ]; then
              healthy=1
              break
            fi
            sleep 1
          done
          docker logs pux
          test "${healthy:-}" = 1
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2525 && head -n 1 <&3' | grep '^220'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/vidurb/pux-server
          tags: |
            type=raw,value=main
            type=sha,prefix=main-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
